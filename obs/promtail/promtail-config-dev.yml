server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://consolas-loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: consolas-catalogo-ms
    static_configs:
      - targets: [localhost]
        labels:
          application: consolas-catalogo-ms
          __path__: /var/log/consolas-catalogo-ms/*.log
  - job_name: consolas-orden-ms
    static_configs:
      - targets: [localhost]
        labels:
          application: consolas-orden-ms
          __path__: /var/log/consolas-orden-ms/*.log