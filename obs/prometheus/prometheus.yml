global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "consolas-microservicios"
    eureka_sd_configs:
      - server: "http://consolas-eureka:8761/eureka"
    metrics_path: "/actuator/prometheus"
    relabel_configs:
      - source_labels: [__meta_eureka_app_name]
        target_label: application

  - job_name: "consolas-config"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["consolas-config:8888"]
        labels:
          application: consolas-config

  - job_name: "consolas-eureka"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["consolas-eureka:8761"]
        labels:
          application: consolas-eureka
