name: consolas-obs-prod

services:
  consolas-prometheus:
    image: prom/prometheus:v3.14.0
    container_name: consolas-prometheus
    restart: unless-stopped
    ports:
      - "29090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - consolas-prod-net

  consolas-loki:
    image: grafana/loki:3.7.6
    container_name: consolas-loki
    restart: unless-stopped
    ports:
      - "23100:3100"
    networks:
      - consolas-prod-net

  consolas-promtail:
    image: grafana/promtail:3.6.8
    container_name: consolas-promtail
    restart: unless-stopped
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - ../services/consolas-catalogo-ms/logs:/var/log/consolas-catalogo-ms:ro
      - ../services/consolas-orden-ms/logs:/var/log/consolas-orden-ms:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - consolas-loki
    networks:
      - consolas-prod-net

networks:
  consolas-prod-net:
    external: true
