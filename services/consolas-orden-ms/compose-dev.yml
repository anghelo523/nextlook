name: consolas-orden-dev

services:
  postgres-orden-dev:
    image: postgres:16-alpine
    container_name: consolas-postgres-orden-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: consolas_orden_db
      POSTGRES_USER: consolas
      POSTGRES_PASSWORD: consolas
    ports:
      - "15434:5432"
    volumes:
      - consolas_orden_dev_data:/var/lib/postgresql/data

volumes:
  consolas_orden_dev_data:
