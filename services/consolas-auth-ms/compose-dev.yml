name: consolas-auth-dev

services:
  postgres-auth-dev:
    image: postgres:16-alpine
    container_name: consolas-postgres-auth-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: consolas_auth_db
      POSTGRES_USER: consolas
      POSTGRES_PASSWORD: consolas
    ports:
      - "15431:5432"
    volumes:
      - consolas_auth_dev_data:/var/lib/postgresql/data

volumes:
  consolas_auth_dev_data:
