server:
  port: 8080

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://keycloak:8080/realms/nextlook/protocol/openid-connect/certs
  datasource:
    url: jdbc:postgresql://postgres-notificaciones:5432/notificaciones_db
    username: nextlook
    password: nextlook
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.nextlook.notificaciones: INFO

eureka:
  instance:
    instance-id: ${spring.application.name}:${random.value}
  client:
    service-url:
      defaultZone: http://nextlook-eureka:8761/eureka

management:
  endpoint:
    health:
      show-details: never
