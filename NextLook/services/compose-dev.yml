# Levanta los 8 microservicios de NextLook sobre la infraestructura de
# docker/docker-compose.infra.yml (Config Server, Eureka, Gateway, Postgres). Se combina
# con ese archivo, no se corre solo (y SIEMPRE con docker-compose.infra.yml como PRIMER -f:
# Docker Compose resuelve las rutas relativas de todos los archivos contra la carpeta del
# primer -f, por eso los "context:" de abajo son relativos a docker/, no a este archivo):
#   docker compose -f docker/docker-compose.infra.yml -f services/compose-dev.yml up -d --build
name: nextlook-services-dev

services:

  catalogo-ms:
    build:
      context: ../services/catalogo-ms
    container_name: catalogo-ms
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      CONFIG_SERVER_URL: http://nextlook-config:18888
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-catalogo:5432/catalogo_db
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://nextlook-eureka:18761/eureka
      EUREKA_INSTANCE_HOSTNAME: catalogo-ms
    depends_on:
      nextlook-config:
        condition: service_healthy
      postgres-catalogo:
        condition: service_healthy
    networks:
      - nextlook-dev-net

