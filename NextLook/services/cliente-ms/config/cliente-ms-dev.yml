server:
  port: 8086

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:18443/realms/nextlook/protocol/openid-connect/certs
  datasource:
    url: jdbc:postgresql://localhost:15437/cliente_db
    username: nextlook
    password: nextlook
    driver-class-name: org.postgresql.Driver
    # S10: si la base no responde, el chequeo 'db' de readiness falla en 3 s (no en los 30 s por defecto)
    hikari:
      connection-timeout: 3000
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.nextlook.cliente: DEBUG

eureka:
  instance:
    hostname: localhost
    instance-id: ${spring.application.name}:${server.port}
  client:
    service-url:
      defaultZone: http://localhost:18761/eureka

# S10 - liveness (el proceso vive) y readiness (puede atender: su base responde)
management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState, db
