server:
  port: 8082

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:18443/realms/nextlook/protocol/openid-connect/certs
  datasource:
    url: jdbc:postgresql://localhost:15433/inventario_db
    username: nextlook
    password: nextlook
    driver-class-name: org.postgresql.Driver
    # S10: si la base no responde, el chequeo 'db' de readiness falla en 3 s (no en los 30 s por defecto)
    hikari:
      connection-timeout: 3000
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:19092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: inventario-ms
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.value.default.type: com.nextlook.inventario.event.OrdenCreadaEvento
        spring.json.trusted.packages: com.nextlook.inventario.event
        spring.json.use.type.headers: false
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.nextlook.inventario: DEBUG

eureka:
  instance:
    hostname: localhost
    instance-id: ${spring.application.name}:${server.port}
  client:
    service-url:
      defaultZone: http://localhost:18761/eureka

app:
  kafka:
    topic:
      orden: orden-eventos
      inventario: inventario-eventos
      pago: pago-eventos

# S10 - liveness (el proceso vive) y readiness (puede atender: su base responde)
management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState, db
