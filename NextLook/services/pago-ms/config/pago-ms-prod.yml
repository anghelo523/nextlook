# Las credenciales de Mercado Pago Sandbox se inyectan por variable de entorno (ver Fase 5), nunca hardcodeadas aqui.
server:
  port: 8080

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://keycloak:8080/realms/nextlook/protocol/openid-connect/certs
  datasource:
    url: jdbc:postgresql://postgres-pago:5432/pago_db
    username: nextlook
    password: nextlook
    driver-class-name: org.postgresql.Driver
    # S10: si la base no responde, el chequeo 'db' de readiness falla en 3 s (no en los 30 s por defecto)
    hikari:
      connection-timeout: 3000
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: nextlook-kafka:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: pago-ms
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.value.default.type: com.nextlook.pago.event.OrdenCreadaEvento
        spring.json.trusted.packages: com.nextlook.pago.event
        spring.json.use.type.headers: false
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.nextlook.pago: INFO

eureka:
  instance:
    instance-id: ${spring.application.name}:${random.value}
  client:
    service-url:
      defaultZone: http://nextlook-eureka:8761/eureka

app:
  kafka:
    topic:
      orden: orden-eventos
      inventario: inventario-eventos
      pago: pago-eventos

# S10 - liveness (el proceso vive) y readiness (puede atender: su base responde)
management:
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState, db
