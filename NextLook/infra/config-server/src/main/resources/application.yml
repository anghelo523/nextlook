server:
  port: 18888

spring:
  application:
    name: nextlook-config
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          # "../config-repo" porque config-repo/ es hermano de este modulo (infra/config-repo),
          # no un hijo suyo. En Docker, CONFIG_REPO_LOCATION lo sobreescribe (ver Dockerfile/compose).
          search-locations: ${CONFIG_REPO_LOCATION:file:../config-repo}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
