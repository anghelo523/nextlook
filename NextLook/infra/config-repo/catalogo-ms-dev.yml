# Placeholder - catalogo-ms todavia no esta implementado (ver Fase 1 del plan de construccion).
# Datasource, puerto y Eureka ya estan fijados segun el esquema de puertos acordado.
server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:15432/catalogo_db
    username: nextlook
    password: nextlook
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.nextlook.catalogo: DEBUG

eureka:
  instance:
    hostname: localhost
    instance-id: ${spring.application.name}:${server.port}
  client:
    service-url:
      defaultZone: http://localhost:18761/eureka
