# Placeholder - pago-ms todavia no esta implementado (ver Fase 2 y Fase 5 del plan de construccion).
# Datasource, puerto y Eureka ya estan fijados segun el esquema de puertos acordado.
# Las credenciales de Mercado Pago Sandbox se inyectan por variable de entorno (ver Fase 5), nunca hardcodeadas aqui.
server:
  port: 8085

spring:
  datasource:
    url: jdbc:postgresql://localhost:15436/pago_db
    username: nextlook
    password: nextlook
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.nextlook.pago: DEBUG

eureka:
  instance:
    hostname: localhost
    instance-id: ${spring.application.name}:${server.port}
  client:
    service-url:
      defaultZone: http://localhost:18761/eureka
