server:
  port: 8761

eureka:
  server:
    enable-self-preservation: false
  instance:
    instance-id: ${spring.application.name}:${random.value}
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://nextlook-eureka:8761/eureka/

management:
  endpoint:
    health:
      show-details: never
