# Observabilidad de DESARROLLO de NextLook. Se combina con la infraestructura y los
# microservicios ya arriba (usa la misma red nextlook-dev-net), por eso se corre junto
# con los otros compose, no solo, y SIEMPRE con docker-compose.infra.yml como PRIMER -f
# (Compose resuelve las rutas relativas de todos los archivos contra la carpeta del primer
# -f, por eso los volumes de abajo son relativos a docker/, no a este archivo):
#   docker compose -f docker/docker-compose.infra.yml -f services/compose-dev.yml -f obs/compose-dev.yml up -d --build
#
# S10: Prometheus (metricas) + Loki/Promtail (logs) + Grafana (tablero "NextLook - Diagnostico").
#   Prometheus  http://localhost:19090/targets
#   Grafana     http://localhost:13000   (admin / admin)
#   Loki        http://localhost:13100/ready
name: nextlook-dev

services:

  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: nextlook-prometheus
    restart: unless-stopped
    volumes:
      - ../obs/prometheus/prometheus-dev.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "19090:9090"
    networks:
      - nextlook-dev-net

  loki:
    image: grafana/loki:3.5.0
    container_name: nextlook-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "13100:3100"
    networks:
      - nextlook-dev-net

  promtail:
    image: grafana/promtail:3.5.0
    container_name: nextlook-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ../obs/promtail/promtail-config-dev.yml:/etc/promtail/config.yml:ro
      # camino 1: consola de los contenedores (API de Docker)
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # camino 2: archivos logs/*.log de lo que corre con Maven en la PC
      - ../services:/var/log/nextlook/services:ro
      - ../infra:/var/log/nextlook/infra:ro
    depends_on:
      - loki
    networks:
      - nextlook-dev-net

  grafana:
    image: grafana/grafana:11.6.0
    container_name: nextlook-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ../obs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../obs/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "13000:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - nextlook-dev-net
