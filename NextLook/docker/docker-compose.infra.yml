# Infraestructura de DESARROLLO de NextLook: Config Server, Eureka, Gateway, las 8 bases
# Postgres y Keycloak. Pensado para que cada integrante corra SOLO sus microservicios
# asignados con Maven (mvn spring-boot:run) contra esta infraestructura ya dockerizada.
# Incluye Kafka + Kafka UI (S08) y el realm "nextlook" de Keycloak que se importa al arrancar (S07).
# La pila completa de produccion local se arma en Fase 7.
name: nextlook-dev

services:

  nextlook-config:
    build:
      context: ../infra/nextlook-config
      dockerfile: Dockerfile
    container_name: nextlook-config
    restart: unless-stopped
    ports:
      - "18888:18888"
    volumes:
      - ../infra/config-repo:/app/config-repo:ro
      - ../infra/nextlook-eureka/config:/app/nextlook-eureka/config:ro
      - ../infra/nextlook-gateway/config:/app/nextlook-gateway/config:ro
      - ../services:/app/services:ro
    environment:
      SPRING_PROFILES_ACTIVE: native
      CONFIG_SEARCH_LOCATIONS: file:/app/config-repo,file:/app/nextlook-eureka/config,file:/app/nextlook-gateway/config,file:/app/services/{application}/config
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/18888' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - nextlook-dev-net

  nextlook-eureka:
    build:
      context: ../infra/nextlook-eureka
      dockerfile: Dockerfile
    container_name: nextlook-eureka
    restart: unless-stopped
    ports:
      - "18761:18761"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      CONFIG_SERVER_URL: http://nextlook-config:18888
    depends_on:
      nextlook-config:
        condition: service_healthy
    networks:
      - nextlook-dev-net

  nextlook-gateway:
    build:
      context: ../infra/nextlook-gateway
      dockerfile: Dockerfile
    container_name: nextlook-gateway
    restart: unless-stopped
    ports:
      - "18080:18080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      CONFIG_SERVER_URL: http://nextlook-config:18888
      # El archivo nextlook-gateway-dev.yml (infra/nextlook-gateway/config) apunta a Eureka por "localhost"
      # y se registra a si mismo como "localhost", pensado para microservicios corridos con Maven fuera
      # de Docker. Dentro de este contenedor "localhost" es el propio gateway (nadie mas lo alcanzaria
      # asi), por eso se sobreescribe solo aqui.
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://nextlook-eureka:18761/eureka
      EUREKA_INSTANCE_HOSTNAME: nextlook-gateway
      # S07: dentro de Docker, Keycloak se alcanza por su nombre de servicio, no por localhost:18443
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI: http://keycloak:8080/realms/nextlook/protocol/openid-connect/certs
    depends_on:
      nextlook-config:
        condition: service_healthy
      nextlook-eureka:
        condition: service_started
    networks:
      - nextlook-dev-net

  postgres-catalogo:
    image: postgres:16-alpine
    container_name: nextlook-postgres-catalogo
    restart: unless-stopped
    environment:
      POSTGRES_DB: catalogo_db
      POSTGRES_USER: nextlook
      POSTGRES_PASSWORD: nextlook
    ports:
      - "15432:5432"
    volumes:
      - nextlook_catalogo_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextlook -d catalogo_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - nextlook-dev-net

  postgres-inventario:
    image: postgres:16-alpine
    container_name: nextlook-postgres-inventario
    restart: unless-stopped
    environment:
      POSTGRES_DB: inventario_db
      POSTGRES_USER: nextlook
      POSTGRES_PASSWORD: nextlook
    ports:
      - "15433:5432"
    volumes:
      - nextlook_inventario_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextlook -d inventario_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - nextlook-dev-net

  postgres-resenas:
    image: postgres:16-alpine
    container_name: nextlook-postgres-resenas
    restart: unless-stopped
    environment:
      POSTGRES_DB: resenas_db
      POSTGRES_USER: nextlook
      POSTGRES_PASSWORD: nextlook
    ports:
      - "15434:5432"
    volumes:
      - nextlook_resenas_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextlook -d resenas_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - nextlook-dev-net

  postgres-orden:
    image: postgres:16-alpine
    container_name: nextlook-postgres-orden
    restart: unless-stopped
    environment:
      POSTGRES_DB: orden_db
      POSTGRES_USER: nextlook
      POSTGRES_PASSWORD: nextlook
    ports:
      - "15435:5432"
    volumes:
      - nextlook_orden_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextlook -d orden_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - nextlook-dev-net

  postgres-pago:
    image: postgres:16-alpine
    container_name: nextlook-postgres-pago
    restart: unless-stopped
    environment:
      POSTGRES_DB: pago_db
      POSTGRES_USER: nextlook
      POSTGRES_PASSWORD: nextlook
    ports:
      - "15436:5432"
    volumes:
      - nextlook_pago_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextlook -d pago_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - nextlook-dev-net

  postgres-cliente:
    image: postgres:16-alpine
    container_name: nextlook-postgres-cliente
    restart: unless-stopped
    environment:
      POSTGRES_DB: cliente_db
      POSTGRES_USER: nextlook
      POSTGRES_PASSWORD: nextlook
    ports:
      - "15437:5432"
    volumes:
      - nextlook_cliente_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextlook -d cliente_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - nextlook-dev-net

  postgres-envio:
    image: postgres:16-alpine
    container_name: nextlook-postgres-envio
    restart: unless-stopped
    environment:
      POSTGRES_DB: envio_db
      POSTGRES_USER: nextlook
      POSTGRES_PASSWORD: nextlook
    ports:
      - "15438:5432"
    volumes:
      - nextlook_envio_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextlook -d envio_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - nextlook-dev-net

  postgres-notificaciones:
    image: postgres:16-alpine
    container_name: nextlook-postgres-notificaciones
    restart: unless-stopped
    environment:
      POSTGRES_DB: notificaciones_db
      POSTGRES_USER: nextlook
      POSTGRES_PASSWORD: nextlook
    ports:
      - "15439:5432"
    volumes:
      - nextlook_notificaciones_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextlook -d notificaciones_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - nextlook-dev-net

  # Keycloak en modo start-dev (HTTP plano, sin TLS). El puerto host 18443 sigue la
  # convencion de la tabla de puertos del equipo, pero el proceso escucha HTTP normal
  # (KC_HTTP_PORT=8080) - la configuracion TLS real, si se necesita, es trabajo de Fase 3.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: nextlook-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
      # S10: /health/live, /health/ready y /metrics en el puerto de management (9000)
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    volumes:
      # S07: realm nextlook (roles CLIENTE/ADMIN, client nextlook-api y usuarios de prueba)
      - ./keycloak/nextlook-realm.json:/opt/keycloak/data/import/nextlook-realm.json:ro
    ports:
      - "18443:8080"
      - "19000:9000"
    networks:
      - nextlook-dev-net

  # S08: broker Kafka en modo KRaft (sin ZooKeeper). Clientes fuera de Docker usan localhost:19092;
  # contenedores de la red nextlook-dev-net usan nextlook-kafka:9092.
  nextlook-kafka:
    image: apache/kafka:4.3.1
    container_name: nextlook-kafka
    restart: unless-stopped
    ports:
      - "19092:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://nextlook-kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@nextlook-kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    networks:
      - nextlook-dev-net

  nextlook-kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    container_name: nextlook-kafka-ui
    restart: unless-stopped
    ports:
      - "18085:8080"
    depends_on:
      - nextlook-kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: nextlook-dev
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: nextlook-kafka:9092
    networks:
      - nextlook-dev-net

networks:
  nextlook-dev-net:
    name: nextlook-dev-net

volumes:
  nextlook_catalogo_dev_data:
  nextlook_inventario_dev_data:
  nextlook_resenas_dev_data:
  nextlook_orden_dev_data:
  nextlook_pago_dev_data:
  nextlook_cliente_dev_data:
  nextlook_envio_dev_data:
  nextlook_notificaciones_dev_data:
